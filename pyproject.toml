[project]
name = "ceo-agent-service"
version = "0.1.0"
description = "Local-first DingTalk executive auto-reply service"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "cryptography>=42",
  "fastapi>=0.115",
  "jieba>=0.42",
  "keyring>=25,<26",
  "mcp[cli]==1.27.0",
  "Pillow>=11",
  "pypdf>=5.0",
  "pydantic>=2.10",
  "robust-json-parser>=0.1.6,<0.2",
  "uvicorn>=0.34"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28",
  "httpx2>=2.9,<3",
  "playwright>=1.50,<2",
  "pytest>=8.3",
  "ruff>=0.15,<0.16"
]
reader-build = [
  "pyinstaller>=6.14,<7",
  "pyobjc-framework-ApplicationServices>=12,<13; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa>=12,<13; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=12,<13; sys_platform == 'darwin'"
]

[project.scripts]
ceo-agent = "app.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "browser: real browser integration tests (set WORKBENCH_BROWSER_TESTS=1)",
  "live: explicit opt-in tests that may call real dws, Codex, or DingTalk"
]
[tool.ruff]
target-version = "py312"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
